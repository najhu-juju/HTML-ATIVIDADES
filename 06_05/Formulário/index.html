<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Formulário Completo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Cadastro</h1>
    </header>

    <main>

        <!-- Formulário de Cadastro -->
        <section>
            <h2>Formulário de Cadastro</h2>

            <form id="formCadastro" method="POST" enctype="multipart/form-data">

                <!-- Dados Pessoais -->
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <p>Este é um formulário de fieldset.</p>

                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Seu nome">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                    <label for="dataNascimento">Data de nascimento:</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </fieldset>

                <!-- Informações -->
                <fieldset>
                    <legend>Informações</legend>

                    <label>Gênero:</label>
                    <label for="masc"><input type="radio" id="masc" name="genero" value="Masculino"> Masculino</label>
                    <label for="femi"><input type="radio" id="femi" name="genero" value="Feminino"> Feminino</label>
                    <label for="outro"><input type="radio" id="outro" name="genero" value="Outro"> Outro</label>

                    <label>Interesses:</label>
                    <label for="tec"><input type="checkbox" id="tec" name="interesses" value="Tecnologia"> Tecnologia</label>
                    <label for="esp"><input type="checkbox" id="esp" name="interesses" value="Esportes"> Esportes</label>
                    <label for="mus"><input type="checkbox" id="mus" name="interesses" value="Música"> Música</label>
                    <label for="jog"><input type="checkbox" id="jog" name="interesses" value="Jogos"> Jogos</label>

                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado">
                        <option value="">Selecione</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MG">MG</option>
                        <option value="MS">MS</option>
                        <option value="MT">MT</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="PR">PR</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="RS">RS</option>
                        <option value="SC">SC</option>
                        <option value="SE">SE</option>
                        <option value="SP">SP</option>
                        <option value="TO">TO</option>
                    </select>

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>

                    <label for="arquivo">Upload de imagem:</label>
                    <input type="file" id="arquivo" name="arquivo" accept=".png,.jpg,.jpeg">
                </fieldset>

                <input type="submit" id="enviar" value="Enviar">
                <input type="reset" id="limpar" value="Limpar">

            </form>
        </section>

        <!-- Resultado será exibido aqui, não é necessário editar -->
        <section>
            <h2 id="sec-resultado">Resultado</h2>
            <div id="resultado"></div>
        </section>

    </main>

    <footer>

        <p>&copy; 2026 - Formulário Turma 01 ADS</p>

        <nav aria-label="Documentações">
            <a href="https://developer.mozilla.org/pt-BR/docs/Web/HTML" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg"
                    alt="Documentação HTML" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/CSS" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg"
                    alt="Documentação CSS" width="40">
            </a>

            <a href="https://developer.mozilla.org/pt-BR/docs/Web/JavaScript" target="_blank">
                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="Documentação JavaScript" width="40">
            </a>
        </nav>

    </footer>

</body>

</html>
